;//////////////////////////////////////////////////////////////////////////////
; FILE: ZuluFontSizeCap.ini (Zulu mod overlay) /////////////////////////////////
; Loaded by GlobalLanguage::init() via loadFileDirectory("Data\English\Language").
; Files in the Language/ directory parse AFTER the top-level Language.ini, so
; with INI_LOAD_OVERWRITE this reliably overrides the archived default.
;
; Restores the classic font-size cap. The compiled default is
; ResolutionFontSizeMethod_ClassicNoCeiling, which removes vanilla's 2.0x
; clamp and makes lobby/UI text grow oversized at 1440p and ultrawide.
; CLASSIC reinstates the cap (adjustFactor clamped to 2.0) to pixel-match
; vanilla / GenTool sizing. See GlobalLanguage.cpp:219-220.
;//////////////////////////////////////////////////////////////////////////////

Language
  ResolutionFontSizeMethod = CLASSIC
End
