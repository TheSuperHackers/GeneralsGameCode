name: GenCI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Pull requests run only while they carry the CI label, which maintainers add.
  # The label name 'CI' is repeated below, because no context can hold it for all uses.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Adding any other label gets its own group, so it cannot cancel a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'CI') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect File Changes
    # The build and replay jobs need this job and are skipped with it.
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'CI') && !(github.event.action == 'labeled' && github.event.label.name != 'CI')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      generals: ${{ steps.filter.outputs.generals }}
      generalsmd: ${{ steps.filter.outputs.generalsmd }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Filter Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          token: ''
          filters: |
            generals:
              - 'Generals/**'
            generalsmd:
              - 'GeneralsMD/**'
            shared:
              - '.github/workflows/**'
              - 'Benchmarks/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'Core/**'
              - 'Dependencies/**'
              - 'GeneralsReplays/**'
              - 'Tests/**'
              - 'vcpkg.json'

      - name: Changes Summary
        run: |
          echo "### 🔍 File Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Generals: ${{ steps.filter.outputs.generals == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GeneralsMD: ${{ steps.filter.outputs.generalsmd == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Shared: ${{ steps.filter.outputs.shared == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY

  # Note the build jobs are split into two jobs for vc6 and win32 because the replay checks
  # only require the vc6 build and compiling vc6 is much faster than win32
  build-generals-vc6:
    name: Build Generals${{ matrix.preset && '' }}
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.generals == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "vc6"
            tools: true
            extras: true
          - preset: "vc6-profile"
            tools: true
            extras: true
          - preset: "vc6-debug"
            tools: true
            extras: true
          - preset: "vc6-releaselog"
            tools: true
            extras: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "Generals"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: ${{ matrix.extras }}
    secrets: inherit

  build-generals-win32:
    name: Build Generals${{ matrix.preset && '' }}
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.generals == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - preset: "win32"
            tools: true
            extras: true
          - preset: "win32-profile"
            tools: true
            extras: true
          - preset: "win32-debug"
            tools: true
            extras: true
          - preset: "win32-vcpkg"
            tools: true
            extras: true
          - preset: "win32-vcpkg-profile"
            tools: true
            extras: true
          - preset: "win32-vcpkg-debug"
            tools: true
            extras: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "Generals"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: ${{ matrix.extras }}
      tests: true
      benchmarks: ${{ matrix.preset == 'win32' }}
    secrets: inherit

  build-generalsmd-vc6:
    name: Build GeneralsMD${{ matrix.preset && '' }}
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.generalsmd == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "vc6"
            tools: true
            extras: true
          - preset: "vc6-profile"
            tools: true
            extras: true
          - preset: "vc6-debug"
            tools: true
            extras: true
          - preset: "vc6-releaselog"
            tools: true
            extras: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: ${{ matrix.extras }}
    secrets: inherit

  build-generalsmd-win32:
    name: Build GeneralsMD${{ matrix.preset && '' }}
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.generalsmd == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - preset: "win32"
            tools: true
            extras: true
          - preset: "win32-profile"
            tools: true
            extras: true
          - preset: "win32-debug"
            tools: true
            extras: true
          - preset: "win32-vcpkg"
            tools: true
            extras: true
            ffmpeg: true
          - preset: "win32-vcpkg-profile"
            tools: true
            extras: true
          - preset: "win32-vcpkg-debug"
            tools: true
            extras: true
      fail-fast: false
    uses: ./.github/workflows/reusable-build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: ${{ matrix.preset }}
      tools: ${{ matrix.tools }}
      extras: ${{ matrix.extras }}
      ffmpeg: ${{ matrix.ffmpeg || false}}
      tests: true
      benchmarks: ${{ matrix.preset == 'win32' }}
    secrets: inherit

  # Runs separately so the build jobs, which also run for pull requests, do not need actions: write.
  cleanup-ccache:
    name: Delete Superseded Compiler Caches
    needs: [build-generals-vc6, build-generals-win32, build-generalsmd-vc6, build-generalsmd-win32]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep Only the Newest Cache per Configuration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $caches = @(gh cache list --ref $env:GITHUB_REF --key ccache- --limit 1000 --json id,key | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "Failed to list caches" }
          $suffix = "-$env:GITHUB_SHA"
          $current = @($caches | Where-Object key -like "*$suffix" | ForEach-Object key)
          foreach ($cache in $caches) {
              $newest = $cache.key.Substring(0, $cache.key.LastIndexOf('-')) + $suffix
              # Configurations that did not save a cache in this run keep their older one.
              if ($cache.key -ne $newest -and $current -contains $newest) {
                  gh cache delete $cache.id
                  if ($LASTEXITCODE -ne 0) { throw "Failed to delete cache $($cache.key)" }
                  Write-Host "Deleted $($cache.key)"
              }
          }

  replaycheck-generals:
    name: Replay Check Generals${{ matrix.preset && '' }}
    needs: [detect-changes, build-generals-vc6]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.generals == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "vc6+t+e"
          - preset: "vc6-releaselog+t+e" # optimized build with logging and crashing enabled should be compatible, so we test that here.
      fail-fast: false
    uses: ./.github/workflows/reusable-check-replays.yml
    with:
      game: "Generals"
      userdata: "GeneralsReplays/Generals/1.08"
      preset: ${{ matrix.preset }}
    secrets: inherit

  replaycheck-generalsmd:
    name: Replay Check GeneralsMD${{ matrix.preset && '' }}
    needs: [detect-changes, build-generalsmd-vc6]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.generalsmd == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - preset: "vc6+t+e"
          - preset: "vc6-releaselog+t+e" # optimized build with logging and crashing enabled should be compatible, so we test that here.
      fail-fast: false
    uses: ./.github/workflows/reusable-check-replays.yml
    with:
      game: "GeneralsMD"
      userdata: "GeneralsReplays/GeneralsZH/1.04"
      preset: ${{ matrix.preset }}
    secrets: inherit

  # The one check branch protection requires. Skipped jobs count as passed there, so this job
  # fails a pull request without the CI label, and any run in which a job failed. Adding any
  # other label reports under another name, so it leaves the result of the last build alone.
  ci-done:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'CI') && 'GenCI Ignored Label' || 'GenCI Done' }}
    needs: [detect-changes, build-generals-vc6, build-generals-win32, build-generalsmd-vc6, build-generalsmd-win32, replaycheck-generals, replaycheck-generalsmd]
    # Also runs when the jobs of a game without changes were skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Check Job Results
        env:
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'CI' }}
          MISSING_LABEL: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'CI') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$OTHER_LABEL" = "true" ]; then
            echo "Another label was added, so nothing was built."
          elif [ "$MISSING_LABEL" = "true" ]; then
            echo "::error::Add the CI label to run GenCI on this pull request."
            exit 1
          elif [ "$FAILED" = "true" ]; then
            echo "::error::At least one GenCI job failed or was cancelled."
            exit 1
          fi
