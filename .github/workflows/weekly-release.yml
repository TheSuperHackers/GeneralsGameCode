name: Weekly GeneralsMD Release

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes (optional)'
        required: false
        default: ''
        type: string
      known_issues:
        description: 'Known issues (optional)'
        required: false
        default: ''
        type: string
      force_changed:
        description: 'Force build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      pre-release:
        description: 'Mark release as pre-release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 9 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  detect-scm-changes:
    needs: get-date
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        run: |
          if [ "${{ github.event.inputs.force_changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ] || [ "$(git diff --name-only "$LAST_TAG"..HEAD | grep -v '^\.github/workflows/' | wc -l)" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-generalsmd:
    needs: [detect-scm-changes, get-date]
    if: needs.detect-scm-changes.outputs.changed == 'true'
    uses: ./.github/workflows/build-toolchain.yml
    with:
      tools: true
      extras: false
    secrets: inherit

  create-release:
    needs: [build-generalsmd, get-date]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download GeneralsMD artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: GeneralsMD-clang-windows-x64+t
          path: generalsmd-artifacts

      - name: Create archive
        run: zip -jr "generalsmd-weekly-${{ needs.get-date.outputs.date }}.zip" generalsmd-artifacts/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: weekly-${{ needs.get-date.outputs.date }}
          name: GeneralsMD Weekly ${{ needs.get-date.outputs.date }}
          body: |
            ${{ github.event.inputs.build_notes }}

            Known issues:
            ${{ github.event.inputs.known_issues }}
          prerelease: ${{ github.event.inputs.pre-release == 'true' }}
          files: generalsmd-weekly-${{ needs.get-date.outputs.date }}.zip
