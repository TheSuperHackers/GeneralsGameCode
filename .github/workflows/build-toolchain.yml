name: Build GeneralsMD Toolchain

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      tools:
        required: false
        default: true
        type: boolean
        description: "Build GeneralsMD tools"
      extras:
        required: false
        default: false
        type: boolean
        description: "Build GeneralsMD extras"

jobs:
  build:
    name: clang-windows-x64${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          $clang = Get-Command clang++.exe -ErrorAction SilentlyContinue
          if (-not $clang) {
              $clang = Get-ChildItem -Path $env:ProgramFiles,${env:ProgramFiles(x86)} -Filter clang++.exe -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          }
          if (-not $clang) {
              throw "clang++.exe was not found after installing LLVM"
          }
          $llvmRoot = Split-Path (Split-Path $clang.Source -Parent) -Parent
          "$llvmRoot\bin" >> $env:GITHUB_PATH
          "LLVM_ROOT=$llvmRoot" >> $env:GITHUB_ENV
          Write-Host "Using LLVM at $llvmRoot"

      - name: Install vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout --detach 3d33b7f7a8121da6e4fa80b35618fc8e960be686
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "$vcpkgRoot" >> $env:GITHUB_PATH
          Write-Host "Using vcpkg at $vcpkgRoot"

      - name: Cache vcpkg packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build\clang-windows-x64\vcpkg_installed
          key: vcpkg-clang-windows-x64-${{ hashFiles('vcpkg.json','vcpkg-lock.json','CMakePresets.json','cmake/toolchains/clang-windows-x64.cmake') }}

      - name: Cache CMake Dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build\clang-windows-x64\_deps
          key: cmake-deps-clang-windows-x64-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}

      - name: Configure GeneralsMD
        shell: pwsh
        run: |
          cmake --preset clang-windows-x64 `
            "-DRTS_BUILD_CORE_TOOLS=${{ inputs.tools && 'ON' || 'OFF' }}" `
            "-DRTS_BUILD_ZEROHOUR_TOOLS=${{ inputs.tools && 'ON' || 'OFF' }}" `
            "-DRTS_BUILD_CORE_EXTRAS=${{ inputs.extras && 'ON' || 'OFF' }}" `
            "-DRTS_BUILD_ZEROHOUR_EXTRAS=${{ inputs.extras && 'ON' || 'OFF' }}"

      - name: Build GeneralsMD
        shell: pwsh
        run: cmake --build --preset clang-windows-x64 --parallel

      - name: Collect GeneralsMD Artifact
        shell: pwsh
        run: |
          $artifactDir = New-Item -ItemType Directory -Force -Path build\GeneralsMD\artifacts
          Get-ChildItem -Path build\clang-windows-x64\GeneralsMD -Recurse -File |
              Where-Object { $_.Extension -in @('.exe', '.dll', '.pdb') } |
              Copy-Item -Destination $artifactDir -Force
          Get-ChildItem -Path build\clang-windows-x64\vcpkg_installed\x64-windows\bin -File -Filter '*.dll' |
              Copy-Item -Destination $artifactDir -Force

      - name: Upload GeneralsMD Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: GeneralsMD-clang-windows-x64${{ inputs.tools && '+t' || '' }}${{ inputs.extras && '+e' || '' }}
          path: build\GeneralsMD\artifacts
          retention-days: 30
          if-no-files-found: error
