name: Build MinGW-w64

# WARNING: Do not declare permissions in this reusable workflow.
# Declare the required permissions in each calling job:
#   contents: read - required for all builds.

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to build (Generals or GeneralsMD)"
      preset:
        required: true
        type: string
        description: "CMake preset"

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MINGW_PACKAGES: mingw-w64 cmake ccache
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get MinGW-w64 Package Cache Key
        id: apt-key
        # Use only the date of the runner image version, because the rest differs between runners of the same image.
        run: echo "key=mingw-apt-v1-${ImageOS}-${ImageVersion%%.*}-${MINGW_PACKAGES// /-}" >> "$GITHUB_OUTPUT"

      - name: Cache MinGW-w64 Packages
        id: cache-apt
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install MinGW-w64 Toolchain
        timeout-minutes: 15
        run: |
          # Download from the Ubuntu mirrors only when the packages are not cached, because the mirrors are sometimes very slow.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=60"
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get clean
            sudo apt-get $APT_OPTS update
            sudo apt-get $APT_OPTS install -y --download-only $MINGW_PACKAGES
            mkdir -p ~/apt-debs
            cp /var/cache/apt/archives/*.deb ~/apt-debs/
          fi
          if ! sudo dpkg -i ~/apt-debs/*.deb; then
            # The cached packages do not fit this runner, so let apt fix the installation from the mirrors.
            sudo apt-get $APT_OPTS update
            sudo apt-get $APT_OPTS install -y -f
          fi

      - name: Cache CMake Dependencies
        id: cache-cmake-deps
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/${{ inputs.preset }}/_deps
          key: cmake-deps-mingw-${{ inputs.preset }}-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}

      - name: Set Up ccache
        id: ccache
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-cache" >> "$GITHUB_ENV"
          # Runner image updates can change timestamps without changing the compiler.
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # GCC precompiled headers bypass ccache without this sloppiness.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"
          # Bound each game/preset cache to limit storage across the build matrix.
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "toolchain=$(i686-w64-mingw32-g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore MinGW-w64 Compilation Cache
        id: ccache-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.game }}-${{ inputs.preset }}-${{ steps.ccache.outputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.game }}-${{ inputs.preset }}-${{ steps.ccache.outputs.toolchain }}-

      - name: Configure ${{ inputs.game }} with CMake (${{ inputs.preset }})
        run: |
          cmake --preset ${{ inputs.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRTS_BUILD_ZEROHOUR=${{ inputs.game == 'GeneralsMD' && 'ON' || 'OFF' }} \
            -DRTS_BUILD_GENERALS=${{ inputs.game == 'Generals' && 'ON' || 'OFF' }} \
            -DRTS_BUILD_CORE_TOOLS=OFF \
            -DRTS_BUILD_GENERALS_TOOLS=OFF \
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF \
            -DRTS_BUILD_CORE_EXTRAS=OFF \
            -DRTS_BUILD_GENERALS_EXTRAS=OFF \
            -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF

      - name: Reset ccache Statistics
        run: ccache --zero-stats

      - name: Build ${{ inputs.game }} (${{ inputs.preset }})
        run: cmake --build build/${{ inputs.preset }} --target ${{ inputs.game == 'Generals' && 'g_generals' || 'z_generals' }} -j$(nproc)

      - name: Show ccache Statistics
        if: ${{ always() }}
        run: ccache --show-stats --verbose

      # Pull requests only restore, so caches change only after changes reach main.
      - name: Save MinGW-w64 Compilation Cache
        if: ${{ github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Collect ${{ inputs.game }} Artifacts
        run: |
          ARTIFACTS_DIR="build/${{ inputs.preset }}/${{ inputs.game }}/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          find build/${{ inputs.preset }}/Core build/${{ inputs.preset }}/${{ inputs.game }} -path "$ARTIFACTS_DIR" -prune -o -type f \( -name "*.exe" -o -name "*.dll" -o -name "*.exe.debug" \) -exec cp -t "$ARTIFACTS_DIR" {} +

      - name: Upload ${{ inputs.game }} ${{ inputs.preset }} Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}
          path: build/${{ inputs.preset }}/${{ inputs.game }}/artifacts
          retention-days: 30
          if-no-files-found: error
