name: Build MinGW-w64

# WARNING: Do not declare permissions in this reusable workflow.
# Declare the required permissions in each calling job:
#   contents: read - required for all builds.

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
        description: "Game to build (Generals or GeneralsMD)"
      preset:
        required: true
        type: string
        description: "CMake preset"

jobs:
  build:
    name: ${{ inputs.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake ccache

      - name: Install Wine and widl
        run: |
          # Add Wine repository
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key

          # Determine Ubuntu codename
          CODENAME=$(lsb_release -cs)

          # Download appropriate sources file
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/${CODENAME}/winehq-${CODENAME}.sources || {
            sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources
          }

          # Update and install Wine
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable wine-stable-dev || {
            sudo apt-get install -y wine-stable-dev
          }

      - name: Cache CMake Dependencies
        id: cache-cmake-deps
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/${{ inputs.preset }}/_deps
          key: cmake-deps-mingw-${{ inputs.preset }}-${{ hashFiles('CMakePresets.json','cmake/**/*.cmake','**/CMakeLists.txt') }}

      - name: Set Up ccache
        id: ccache
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache-cache" >> "$GITHUB_ENV"
          # Runner image updates can change timestamps without changing the compiler.
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          # GCC precompiled headers bypass ccache without this sloppiness.
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros" >> "$GITHUB_ENV"
          # Bound each game/preset cache to limit storage across the build matrix.
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "toolchain=$(i686-w64-mingw32-g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      - name: Restore MinGW-w64 Compilation Cache
        id: ccache-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.game }}-${{ inputs.preset }}-${{ steps.ccache.outputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.game }}-${{ inputs.preset }}-${{ steps.ccache.outputs.toolchain }}-

      - name: Configure ${{ inputs.game }} with CMake (${{ inputs.preset }})
        run: |
          cmake --preset ${{ inputs.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRTS_BUILD_ZEROHOUR=${{ inputs.game == 'GeneralsMD' && 'ON' || 'OFF' }} \
            -DRTS_BUILD_GENERALS=${{ inputs.game == 'Generals' && 'ON' || 'OFF' }} \
            -DRTS_BUILD_CORE_TOOLS=OFF \
            -DRTS_BUILD_GENERALS_TOOLS=OFF \
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF \
            -DRTS_BUILD_CORE_EXTRAS=OFF \
            -DRTS_BUILD_GENERALS_EXTRAS=OFF \
            -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF

      - name: Reset ccache Statistics
        run: ccache --zero-stats

      - name: Build ${{ inputs.game }} (${{ inputs.preset }})
        run: cmake --build build/${{ inputs.preset }} --target ${{ inputs.game == 'Generals' && 'g_generals' || 'z_generals' }} -j$(nproc)

      - name: Show ccache Statistics
        if: ${{ always() }}
        run: ccache --show-stats --verbose

      # Pull requests only restore, so caches change only after changes reach main.
      - name: Save MinGW-w64 Compilation Cache
        if: ${{ github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Collect ${{ inputs.game }} Artifacts
        run: |
          ARTIFACTS_DIR="build/${{ inputs.preset }}/${{ inputs.game }}/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          find build/${{ inputs.preset }}/Core build/${{ inputs.preset }}/${{ inputs.game }} -path "$ARTIFACTS_DIR" -prune -o -type f \( -name "*.exe" -o -name "*.dll" -o -name "*.exe.debug" \) -exec cp -t "$ARTIFACTS_DIR" {} +

      - name: Upload ${{ inputs.game }} ${{ inputs.preset }} Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.game }}-${{ inputs.preset }}
          path: build/${{ inputs.preset }}/${{ inputs.game }}/artifacts
          retention-days: 30
          if-no-files-found: error
